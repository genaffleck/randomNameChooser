<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Random Name Picker</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                background: #f4f4f9;
            }

            .container {
                background: white;
                padding: 40px;
                border-radius: 12px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                text-align: center;
                max-width: 600px; /* increased from 400px */
                width: 95%;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 20px;
                color: #333;
            }

            select {
                text-align: center;
            }

            select,
            button {
                margin: 10px 0;
                padding: 10px;

                font-size: 1rem;
                border-radius: 8px;
                border: 1px solid #ccc;
                width: 100%;
            }

            button {
                border: none;
                cursor: pointer;
                background: #007bff;
                color: white;
                transition: 0.3s;
            }

            button:hover {
                background: #0056b3;
            }

            #result {
                margin-top: 20px;
                font-size: 1.3rem;
                font-weight: bold;
                color: #222;
                min-height: 40px;
            }

            /* Spinner */
            .spinner {
                margin: 20px auto;
                border: 6px solid #f3f3f3;
                border-top: 6px solid #007bff;
                border-radius: 50%;
                width: 50px;
                height: 50px;
                animation: spin 1s linear infinite;
                display: none;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            /* Mobile responsiveness */
            @media (max-width: 600px) {
                h1 {
                    font-size: 1.2rem;
                }
                button,
                select {
                    font-size: 1rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Sir Ruiz Math Class</h1>

            <label for="csvSelect"></label>
            <select id="csvSelect">
                <option value="Diamond.csv">9-Diamond</option>
                <option value="Emerald.csv">9-Emerald</option>
                <option value="Fluorite.csv">9-Fluorite</option>
                <option value="Pearl.csv">9-Pearl</option>
                <option value="Peridot.csv">9-Peridot</option>
                <option value="Quartz.csv">9-Quartz</option>
            </select>

            <button onclick="loadCSV()">Load Class</button>
            <button onclick="pickRandom()">Pick Random Name</button>

            <div class="spinner" id="spinner"></div>
            <p id="result">Select a CSV and load it</p>
        </div>

        <script>
            function toTitleCase(str) {
                return str
                    .toLowerCase() // make everything lowercase first
                    .split(" ") // split string into words
                    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                    .join(" ");
            }
            let names = [];

            // Load selected CSV

            function loadCSV() {
                const fileName = document.getElementById("csvSelect").value;

                fetch(fileName)
                    .then(response => response.text())
                    .then(text => {
                        names = text
                            .split(/\r?\n/)
                            .map(line => line.trim())
                            .filter(line => line.length > 0);
                        const displayName = fileName.replace(".csv", "");
                        document.getElementById(
                            "result"
                        ).textContent = `9-${toTitleCase(
                            displayName
                        )} is chosen`;
                    })
                    .catch(err => {
                        document.getElementById("result").textContent =
                            "Error loading " + fileName;
                        console.error(err);
                    });
            }

            // Pick random name with spinner delay
            function pickRandom() {
                if (names.length === 0) {
                    alert("Please load a CSV file first!");
                    return;
                }

                const spinner = document.getElementById("spinner");
                const result = document.getElementById("result");

                // Show spinner, clear old result
                spinner.style.display = "block";
                result.textContent = "";

                // Wait x seconds, then show random name
                setTimeout(() => {
                    spinner.style.display = "none";
                    const randomIndex = Math.floor(
                        Math.random() * names.length
                    );
                    const randomName = names[randomIndex];
                    result.textContent = "🎉 " + randomName + " 🎉";
                }, 1000);
            }
        </script>
    </body>
</html>
